# 公开抓放数据的正式微调配置；这些数值是实验起点，不是收敛或显存保证。
[paths]
base_dir = ".."
cache_dir = "../../.cache/smolvla"
run_dir = "outputs/smolvla/so100-pickplace"

[dataset]
repo_id = "lerobot/svla_so100_pickplace"
revision = "main"
validation_fraction = 0.2
split_seed = 42
video_backend = "torchcodec"

[policy]
repo_id = "lerobot/smolvla_base"
revision = "main"
backbone_revision = "main"
chunk_size = 50
num_steps = 10
train_expert_only = true
freeze_vision_encoder = true
train_state_proj = true
use_amp = false

[training]
steps = 20000
batch_size = 8
num_workers = 0
learning_rate = 0.0001
warmup_steps = 1000
save_freq = 2000
log_freq = 100
eval_freq = 2000
max_eval_samples = 256
seed = 42

