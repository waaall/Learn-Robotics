# 离线推理单独部署，只声明数据与模型依赖，不引入训练日志和硬件 extras。
[project]
name = "robot-policy-inference"
version = "0.1.0"
description = "Windows SmolVLA offline action-chunk inference and comparison"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lerobot[dataset,smolvla]==0.6.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchcodec==0.10.0",
    "smolvla-common==0.1.0",
]

# 实时入口只读取从臂，不需要训练项目或硬件项目的 Python 环境。
[project.optional-dependencies]
live = ["lerobot[feetech]==0.6.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
smolvla-common = { path = "../../packages/smolvla_common", editable = true }
