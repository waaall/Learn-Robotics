[project]
name = "so101-lab"
version = "0.1.0"
description = "SO-101 Windows environment and hardware-free validation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lerobot[core_scripts,training,feetech]==0.6.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchcodec==0.10.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
