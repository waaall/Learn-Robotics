map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=5s ipv6=off;
upstream robotics_api { zone api 64k; server api:8000 resolve; }
upstream robotics_viewer { zone viewer 64k; server api:8081 resolve; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 64m;

    # 顶层页面与 iframe 都需要隔离，以支持官方 WASM 的 pthread/SharedArrayBuffer。
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://robotics_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 官方客户端保留 /model、/ui、/state、/drop、/assets 根路径。
    # 应用自身的 Vite 资源在 /lab-assets，避免与查看器资源冲突。
    location = /viewer { return 302 /viewer/; }
    location /viewer/ {
        proxy_pass http://robotics_viewer/;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_buffering off;
    }
    location ~ ^/(ui|state|drop|model|assets)(/|$) {
        proxy_pass http://robotics_viewer;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /lab-assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
