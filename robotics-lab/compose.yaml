# 所有 Docker 宿主机共用同一个应用服务；离线包也使用此文件。
name: robotics-lab
services:
  lab:
    image: robotics-lab:${ROBOTICS_LAB_TAG:-0.1.0}
    # 镜像由源码构建或离线导入，启动时不访问未发布的默认仓库。
    pull_policy: never
    ports:
      - '${ROBOTICS_LAB_HOST:-127.0.0.1}:${ROBOTICS_LAB_PORT:-18320}:8000'
    volumes:
      - robotics-lab-data:/var/lib/robotics-lab
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  robotics-lab-data:
